services:
  mysql:
    image: mysql:8.4
    container_name: ai-chat-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_chat}
      MYSQL_USER: ${MYSQL_USER:-ai_chat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_chat}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - /Users/wangxin/Desktop/ai-chat/.db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
